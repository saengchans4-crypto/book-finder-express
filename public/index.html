<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Finder — Open Library Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,620&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <div class="brand">
      <h1 class="serif">Book Finder</h1>
      <p>ค้นหาและจัดเรียงหนังสือจาก Open Library</p>
    </div>
    <button id="themeBtn" class="ghost-btn" type="button">🌙 โหมดมืด</button>
  </div>

  <div class="searchbar">
    <div class="search-field">
      <input id="q" type="text" placeholder="ค้นหาชื่อหนังสือหรือผู้แต่ง..." autocomplete="off">
      <div id="suggest" class="suggestions"></div>
    </div>
    <button id="go" class="primary-btn" type="button">ค้นหา</button>
    <button id="surprise" class="ghost-btn" type="button" title="สุ่มหนังสือสักเล่ม">🎲 สุ่มหนังสือ</button>
  </div>
</header>

<main>
  <section class="results-area">
    <div class="toolbar">
      <div class="field">
        <label for="sortSel">เรียงตาม</label>
        <select id="sortSel">
          <option value="relevance">ความเกี่ยวข้อง</option>
          <option value="edition_desc">จำนวน Edition มากสุด</option>
          <option value="edition_asc">จำนวน Edition น้อยสุด</option>
          <option value="year_desc">ปีพิมพ์ล่าสุดก่อน</option>
          <option value="year_asc">ปีพิมพ์เก่าสุดก่อน</option>
          <option value="title_asc">ชื่อ A–Z</option>
        </select>
      </div>

      <div class="field jumpyear">
        <label for="yearJump">กระโดดไปปี</label>
        <input id="yearJump" type="number" placeholder="เช่น 1995">
        <button id="jumpBtn" class="ghost-btn" type="button">ไป</button>
      </div>

      <div class="status" id="status">พิมพ์คำค้นหาเพื่อเริ่ม</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="pagination-controls" id="paginationControls" style="display:none">
      <button id="prevPageBtn" class="ghost-btn" type="button">‹ ก่อนหน้า</button>
      <span class="page-indicator" id="pageIndicator">หน้า 1</span>
      <button id="nextPageBtn" class="ghost-btn" type="button">ถัดไป ›</button>
      <button id="loadmoreBtn" class="ghost-btn loadmore-btn" type="button" style="display:none">โหลดเพิ่มในหน้านี้</button>
    </div>
  </section>

  <aside class="rail">
    <section class="rail-panel">
      <h2>ดูล่าสุด</h2>
      <p class="rail-sub">เก็บ 8 รายการล่าสุดที่เปิดดู</p>
      <div id="stackList"><div class="empty">ยังไม่มีรายการ</div></div>
    </section>

    <section class="rail-panel">
      <h2>เปรียบเทียบ</h2>
      <p class="rail-sub">เลือกได้สูงสุด 3 เล่ม</p>
      <div id="cmpList"><div class="empty">กด "เปรียบเทียบ" ที่การ์ดหนังสือ</div></div>
      <div id="shared"></div>
    </section>
  </aside>
</main>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <button id="modalClose" class="ghost-btn modal-close" type="button">ปิด ✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
